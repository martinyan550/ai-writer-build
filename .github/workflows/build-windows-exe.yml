name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: 构建 EXE
        run: |
          pyinstaller --onefile --windowed --name ai_writer_human ai_writer_human.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ai_writer_human-windows
          path: dist/ai_writer_human.exe
          retention-days: 30
